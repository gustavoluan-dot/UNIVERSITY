<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Estudando Formulários</h1>
    </header>

    <main>

        <section>
            
            <article>

                <h1>Primeiro formulario</h1>

                <form>

                    <fieldset>

                       <legend>Informações Pessoais</legend>

                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome" required>

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>

                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" pattern="[0-9] {2} - [0-9 {5} - [0-9] {4}"> 

                        <label for="nascimento">Data de nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento">

                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" name="idade" min="18" max="120">

                        <button type="submit">Enviar</button>


                    </fieldset>

                    <fieldset>

                        <legend>Preferências</legend>

                        <label for="cor">Cor Favorita:</label>
                        <input type="color" id="cor" name="cor">

                        <label for="volume">Volume:</label>
                        <input type="range" id="volume" name="volume" min="0" max="100" value="50">

                        <button type="submit">Enviar</button>


                    </fieldset>
                 
                    
                </form>

            </article>
            
        </section>

        <section>

            <article>
                    <h2>Elementos Interativos Avançados</h2>

                    <details>
                        <summary>Clique aqui para ver mais informações</summary>
                        <p>Conteudo adicional que aparece quando expandido.</p>
                    </details>
                    <br><br><br>

                 <datalist id="Faculdade">
                        <option value="UNICID"></option>
                        <option value="UNIP"></option>
                        <option value="CRUZEIRO DO SUL"></option>
                        <option value="SAO JUDAS"></option>
                 </datalist>

                 <label for="collegue">Selecione a sua faculdade:</label>
                 <input list="Faculdade" name="collegue" id="collegue">
            </article>

        </section>
        
        <section>

            <article>

                <h2>Navegadores</h2>
                 
                <datalist id="navegadores">
                    <option value="Chrome">
                    <option value="Firefox">
                    <option value="Safari">
                    <option value="Edge">
                </datalist>

                <label for="navegador">Escolha seu navegador:</label>
                <input list="navegadores" id="navegador" name="navegador">

            </article>

        </section>

        <section>

            <article>
                <h2>Dados numerios com Pattern</h2>

                <!--CPF-->
                <input type="text" pattern="[0-9]\.[0-9] {3}\. [0-9] {3} - [0-9 {2}]" placeholder="000.000.000-00" title="Formato: 00000-00" maxlength="14">

                <!--CEP-->
                <input type="text" pattern="[0-9] {5} - [0-9] {3}" placeholder="00000-000" title="Formato: 00000-000">

                <!--Telefone-->
                <input type="text" pattern="\([0-9] {2}\) - [0-9] {5} - [0-9] {4}" placeholder="(00) 00000-0000" title="Formato: () 00000-0000 ">
            </article>

        </section>

    </main>

</body>
</html>
