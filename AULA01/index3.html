<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>
<body>
    <header>
        <h1>Welcome to HTML5!</h1>
        <p class="p span">This is a word example!</p>
    </header>
    <main>

        <h2>Undered List</h2>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>

        <h2>Ordered List</h2>
        <ol>
            <li>First step</li>
            <li>Second step</li>
            <li>Third step</li>
        </ol>    
    </main>
    
    <table> <h1>Table</h1>
        <thead>
            <th>Gustavo</th>
            <th>Luan</th>
            <th>São Paulo</th>
        </thead>

        <tbody>
            <tr>
                <td>19 years</td>
                <td>Last name</td>
                <td>My city</td>
            </tr>
            <tr>
                <td>Last</td>
                <td>Step</td>
                <td>Thanks</td>
            </tr>
           
        </tbody>
    </table>
</body>
</html>
